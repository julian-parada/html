<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para ti 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     BASE
     ========================================================= */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    overflow:hidden;
    font-family:'Quicksand',system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#f3b98f;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
  }

  /* =========================================================
     CIELO, RAYOS Y PARTÍCULAS
     ========================================================= */
  #cielo{
    position:fixed;inset:0;z-index:0;
    background:radial-gradient(ellipse at 50% 45%,
      #fff6e0 0%, #ffdcab 26%, #f6b088 55%, #dc8a7c 82%, #b9687c 100%);
  }
  #rayos{
    position:fixed;left:50%;top:48%;z-index:1;
    width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.22) 0deg 5deg, rgba(255,255,255,0) 5deg 15deg);
    -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.45) 16%,transparent 40%);
            mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.45) 16%,transparent 40%);
    opacity:0;transition:opacity 2.5s ease;
    animation:girar 150s linear infinite;
  }
  body.abierto #rayos{opacity:1}
  @keyframes girar{to{transform:rotate(360deg)}}

  #particulas{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

  /* =========================================================
     ESCENA DEL RAMO
     ========================================================= */
  .scene{
    position:fixed;inset:0;z-index:3;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .scene > svg{width:100%;height:100%;overflow:visible}
  @media (orientation:portrait){
    .scene > svg{width:135vw;height:auto;flex-shrink:0;margin-top:6vh}
  }

  /* Colores del ramo */
  .leaf{fill:#617a43}
  .leaf2{fill:#78935a}
  .paper{fill:url(#gPapel);stroke:#efe2d4;stroke-width:3}
  .paperPink{fill:url(#gPapelRosa);stroke:#fff6f1;stroke-width:3}
  .shine{fill:none;stroke:#fff;stroke-width:2.5;opacity:.7}
  .ribbonThin{fill:none;stroke:url(#gLazo);stroke-width:5;stroke-linecap:round}
  .stem{fill:none;stroke:#58703d;stroke-width:7;stroke-linecap:round}
  .rama{fill:none;stroke:#5b7045;stroke-width:5;stroke-linecap:round}
  .bow{fill:url(#gLazo);stroke:#8e1f3f;stroke-width:1.5}

  /* ---- Animación de entrada ---- */
  .papel{opacity:0;transform:translateY(60px)}
  body.abierto .papel{animation:subir 1s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:var(--d,0s)}
  @keyframes subir{to{opacity:1;transform:none}}

  .tallo{stroke-dasharray:1;stroke-dashoffset:1}
  body.abierto .tallo{animation:dibujar 1.3s ease-out forwards;animation-delay:var(--d,.6s)}
  @keyframes dibujar{to{stroke-dashoffset:0}}

  .aparece{opacity:0}
  body.abierto .aparece{animation:aparecer 1s ease forwards;animation-delay:var(--d,1.4s)}
  @keyframes aparecer{to{opacity:1}}

  .lazo{transform:scale(0)}
  body.abierto .lazo{animation:pop .9s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:.9s}
  @keyframes pop{to{transform:scale(1)}}

  /* Girasoles: crecen, se mecen y giran al tocarlos */
  .flor-clic{cursor:pointer}
  .crece{transform:scale(0) rotate(-140deg)}
  body.abierto .crece{animation:florecer 1.3s cubic-bezier(.2,1.35,.4,1) forwards;animation-delay:var(--d)}
  @keyframes florecer{to{transform:scale(1) rotate(0deg)}}

  .balanceo{animation:balanceo var(--b,4s) ease-in-out infinite alternate;animation-delay:var(--s,0s)}
  @keyframes balanceo{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

  .gira.activa{animation:giro 1.1s cubic-bezier(.3,1.25,.5,1)}
  @keyframes giro{
    0%{transform:rotate(0) scale(1)}
    45%{transform:rotate(220deg) scale(1.18)}
    100%{transform:rotate(360deg) scale(1)}
  }

  /* =========================================================
     TÍTULO
     ========================================================= */
  #titulo{
    position:fixed;left:0;right:0;z-index:4;
    top:max(14px,env(safe-area-inset-top));
    text-align:center;pointer-events:none;padding:0 12px;
  }
  #titulo h1{
    font-family:'Dancing Script',cursive;font-weight:700;
    font-size:clamp(2.2rem,7vw,4.3rem);line-height:1.1;
    color:#7a2e14;
    text-shadow:0 0 22px rgba(255,255,255,.9),0 2px 0 rgba(255,255,255,.65);
  }
  #titulo h1 span{display:inline-block;opacity:0;transform:translateY(20px) scale(.5) rotate(-10deg)}
  body.abierto #titulo h1 span{
    animation:letra .75s cubic-bezier(.2,1.6,.4,1) forwards;
    animation-delay:calc(2.4s + var(--i) * .06s);
  }
  @keyframes letra{to{opacity:1;transform:none}}
  #titulo .corazones{
    margin-top:4px;font-size:clamp(1rem,3vw,1.35rem);letter-spacing:.4em;
    opacity:0;
  }
  body.abierto #titulo .corazones{animation:aparecer 1.2s ease forwards 3.7s}

  /* =========================================================
     PISTA Y CONTADOR
     ========================================================= */
  #pista{
    position:fixed;left:50%;z-index:60;
    bottom:max(16px,env(safe-area-inset-bottom));
    transform:translate(-50%,20px);
    display:flex;align-items:center;gap:10px;
    padding:9px 16px;border-radius:999px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,255,255,.8);
    box-shadow:0 8px 24px rgba(120,50,40,.18);
    color:#5a2a3a;font-weight:600;font-size:.92rem;white-space:nowrap;
    opacity:0;transition:opacity .8s ease,transform .8s ease;
    pointer-events:none;
  }
  #pista.visible{opacity:1;transform:translate(-50%,0)}
  #pista-texto{transition:opacity .4s,max-width .6s;max-width:400px;overflow:hidden}
  #pista.ya #pista-texto{opacity:0;max-width:0}
  #contador{
    background:linear-gradient(135deg,#ff7eb6,#c77dff);color:#fff;
    padding:3px 10px;border-radius:999px;font-weight:700;
  }
  #contador.salto{animation:salto .5s cubic-bezier(.2,1.8,.4,1)}
  @keyframes salto{50%{transform:scale(1.35)}}

  /* =========================================================
     MARIPOSAS
     ========================================================= */
  .mariposa{
    position:fixed;left:0;top:0;z-index:50;
    cursor:pointer;touch-action:manipulation;
    transition-property:left,top;transition-timing-function:ease-in-out;
  }
  .mariposa .vuelo{width:100%;height:100%;animation:flotar 1.4s ease-in-out infinite alternate}
  @keyframes flotar{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
  .mariposa svg{
    width:100%;height:100%;overflow:visible;
    transform:rotate(var(--giro,0deg));transition:transform .6s ease;
  }
  .mariposa.vista svg{filter:drop-shadow(0 0 7px rgba(255,255,255,.95))}
  .mariposa.toque .vuelo{animation:toque .45s ease}
  @keyframes toque{50%{transform:scale(1.4)}}

  .ala-izq,.ala-der{transform-box:fill-box;animation:aletear .22s ease-in-out infinite alternate}
  .ala-izq{transform-origin:right center}
  .ala-der{transform-origin:left center}
  @keyframes aletear{from{transform:scaleX(1)}to{transform:scaleX(.3)}}

  /* =========================================================
     TARJETA DEL MENSAJE
     ========================================================= */
  #mensaje-fondo{
    position:fixed;inset:0;z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(40,15,45,.45);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:opacity .35s ease;
  }
  #mensaje-fondo.visible{opacity:1;pointer-events:auto}

  #mensaje-mariposa{
    position:relative;width:100%;max-width:390px;
    padding:40px 26px 24px;
    background:linear-gradient(160deg,#ffffff 0%,#fff4fb 55%,#fdeeff 100%);
    border:2px solid #f1cdf9;border-radius:24px;
    box-shadow:0 20px 60px rgba(120,40,140,.4);
    text-align:center;
    transform:translateY(40px) scale(.85) rotate(-3deg);
    transition:transform .5s cubic-bezier(.2,1.45,.4,1);
  }
  #mensaje-fondo.visible #mensaje-mariposa{transform:none}
  #mensaje-mariposa.final{
    border-color:#ffd54d;
    background:linear-gradient(160deg,#fffdf3 0%,#fff3d1 100%);
    box-shadow:0 20px 70px rgba(255,170,0,.45);
  }

  .mensaje-icono{
    position:absolute;top:-30px;left:50%;transform:translateX(-50%);
    width:60px;height:60px;display:grid;place-items:center;
    font-size:1.9rem;background:#fff;
    border:2px solid #f1cdf9;border-radius:50%;
    box-shadow:0 6px 18px rgba(120,40,140,.25);
    animation:latidoIcono 1.6s ease-in-out infinite;
  }
  .final .mensaje-icono{border-color:#ffd54d}
  @keyframes latidoIcono{50%{transform:translateX(-50%) scale(1.1)}}

  #mensaje-num{
    display:block;margin-bottom:10px;
    font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:#b67cd6;
  }
  .final #mensaje-num{color:#d49a00}

  #mensaje-texto{
    min-height:3em;color:#3a2a4d;
    font-size:1.2rem;font-weight:600;line-height:1.5;word-wrap:break-word;
  }
  #mensaje-texto.escribiendo::after{
    content:"|";margin-left:2px;color:#c77dff;
    animation:parpadeo .7s steps(1) infinite;
  }
  @keyframes parpadeo{50%{opacity:0}}

  .mensaje-firma{margin-top:14px;font-family:'Dancing Script',cursive;font-size:1.3rem;color:#c0395a}

  #mensaje-cerrar{
    position:absolute;top:10px;right:12px;width:34px;height:34px;
    border:none;border-radius:50%;background:transparent;
    color:#8a6aa8;font-size:1.15rem;cursor:pointer;
  }
  #mensaje-cerrar:hover,#mensaje-cerrar:focus-visible{background:#f3e0ff;outline:none}

  /* =========================================================
     INTRO (pantalla de "toca para abrir")
     ========================================================= */
  #intro{
    position:fixed;inset:0;z-index:2000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 42%,#4d2a40 0%,#25121f 65%,#12080f 100%);
    color:#fff;cursor:pointer;text-align:center;padding:20px;
    transition:opacity 1.1s ease,visibility 1.1s;
  }
  #intro.fuera{opacity:0;visibility:hidden}
  .estrella{
    position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;
    animation:titilar 2.5s ease-in-out infinite;
  }
  @keyframes titilar{0%,100%{opacity:.15}50%{opacity:1}}
  .intro-flor-wrap{position:relative;width:min(52vw,230px);aspect-ratio:1}
  .intro-flor-wrap::before{
    content:"";position:absolute;inset:-25%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,200,60,.55) 0%,transparent 65%);
    animation:latido 1.6s ease-in-out infinite;
  }
  .intro-flor{position:relative;width:100%;height:100%;overflow:visible;animation:girar 20s linear infinite}
  @keyframes latido{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.07)}}
  .intro-texto{
    font-family:'Dancing Script',cursive;font-weight:700;
    font-size:clamp(2.1rem,8vw,3.2rem);
    text-shadow:0 0 20px rgba(255,190,60,.6);
  }
  .intro-sub{
    font-size:.85rem;letter-spacing:.25em;text-transform:uppercase;opacity:.75;
    animation:respirar 2s ease-in-out infinite;
  }
  @keyframes respirar{50%{opacity:.3}}

  /* =========================================================
     ACCESIBILIDAD: menos movimiento
     ========================================================= */
  @media (prefers-reduced-motion: reduce){
    .papel,.crece,.lazo,.aparece,#titulo h1 span,#titulo .corazones{
      animation:none!important;opacity:1!important;transform:none!important;
    }
    .tallo{animation:none!important;stroke-dashoffset:0!important}
    .balanceo,.ala-izq,.ala-der,.mariposa .vuelo,#rayos,.intro-flor{animation:none!important}
    #mensaje-mariposa{transition:none}
  }
</style>
</head>
<body>

<div id="cielo"></div>
<div id="rayos"></div>

<!-- ===================== RAMO ===================== -->
<div class="scene">
<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" aria-label="Ramo de girasoles">
  <defs>
    <!-- Pétalos -->
    <linearGradient id="gPetalo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f29200"/>
      <stop offset=".45" stop-color="#ffc21a"/>
      <stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
    <linearGradient id="gPetaloAtras" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d06e00"/>
      <stop offset="1" stop-color="#f5ad00"/>
    </linearGradient>
    <!-- Centro -->
    <radialGradient id="gCentro" cx=".45" cy=".4">
      <stop offset="0" stop-color="#8a5226"/>
      <stop offset=".55" stop-color="#4f2811"/>
      <stop offset="1" stop-color="#2a1408"/>
    </radialGradient>
    <!-- Papel y lazo -->
    <linearGradient id="gPapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f2e3d3"/>
    </linearGradient>
    <linearGradient id="gPapelRosa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde9e3"/>
      <stop offset="1" stop-color="#f0c3bb"/>
    </linearGradient>
    <linearGradient id="gLazo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6607f"/>
      <stop offset="1" stop-color="#9c2246"/>
    </linearGradient>
    <filter id="desenfoque"><feGaussianBlur stdDeviation="10"/></filter>

    <!-- El girasol se genera con JavaScript aquí dentro -->
    <g id="flower"></g>
  </defs>

  <!-- sombra en el piso -->
  <ellipse cx="550" cy="808" rx="240" ry="20" fill="rgba(90,35,30,.25)" filter="url(#desenfoque)"/>

  <g transform="translate(550 520) scale(0.8) translate(-550 -500)">

    <!-- papel de atrás -->
    <g class="papel" style="--d:0s">
      <path class="paper" d="M135 205 L285 105 L520 330 L250 600Z"/>
      <path class="paperPink" d="M260 125 L505 25 L650 350 L360 610Z"/>
      <path class="paper" d="M475 65 L735 25 L805 360 L550 610Z"/>
      <path class="paperPink" d="M675 125 L905 75 L950 405 L690 610Z"/>
      <path class="paper" d="M820 200 L1045 160 L980 500 L760 625Z"/>
      <path class="paperPink" d="M55 260 L205 215 L360 520 L160 545Z"/>
    </g>

    <!-- tallos -->
    <g>
      <path class="stem tallo" pathLength="1" style="--d:.6s"  d="M285 535 Q360 350 470 175"/>
      <path class="stem tallo" pathLength="1" style="--d:.7s"  d="M410 565 Q505 330 550 145"/>
      <path class="stem tallo" pathLength="1" style="--d:.65s" d="M550 580 Q590 330 700 190"/>
      <path class="stem tallo" pathLength="1" style="--d:.75s" d="M675 565 Q735 365 870 250"/>
      <path class="stem tallo" pathLength="1" style="--d:.8s"  d="M770 550 Q825 390 955 300"/>
    </g>

    <!-- ramas de eucalipto -->
    <g>
      <path class="rama tallo" pathLength="1" style="--d:.9s"  d="M190 515 Q180 350 130 255"/>
      <path class="rama tallo" pathLength="1" style="--d:.95s" d="M320 430 Q355 275 405 150"/>
      <path class="rama tallo" pathLength="1" style="--d:1s"   d="M555 350 Q575 215 535 85"/>
      <path class="rama tallo" pathLength="1" style="--d:.95s" d="M735 420 Q800 260 900 180"/>
      <path class="rama tallo" pathLength="1" style="--d:.9s"  d="M850 500 Q910 390 1000 350"/>
    </g>
    <g class="leaf aparece" style="--d:1.5s">
      <ellipse cx="143" cy="280" rx="13" ry="27" transform="rotate(-35 143 280)"/>
      <ellipse cx="160" cy="315" rx="13" ry="27" transform="rotate(35 160 315)"/>
      <ellipse cx="150" cy="360" rx="13" ry="27" transform="rotate(-35 150 360)"/>
      <ellipse cx="178" cy="395" rx="13" ry="27" transform="rotate(30 178 395)"/>
      <ellipse cx="384" cy="190" rx="13" ry="27" transform="rotate(-55 384 190)"/>
      <ellipse cx="410" cy="225" rx="13" ry="27" transform="rotate(35 410 225)"/>
      <ellipse cx="397" cy="270" rx="13" ry="27" transform="rotate(-40 397 270)"/>
      <ellipse cx="548" cy="120" rx="14" ry="29" transform="rotate(-30 548 120)"/>
      <ellipse cx="570" cy="160" rx="14" ry="29" transform="rotate(40 570 160)"/>
      <ellipse cx="552" cy="205" rx="14" ry="29" transform="rotate(-35 552 205)"/>
      <ellipse cx="800" cy="270" rx="14" ry="29" transform="rotate(-45 800 270)"/>
      <ellipse cx="835" cy="300" rx="14" ry="29" transform="rotate(40 835 300)"/>
      <ellipse cx="875" cy="230" rx="14" ry="29" transform="rotate(-35 875 230)"/>
      <ellipse cx="930" cy="330" rx="14" ry="29" transform="rotate(45 930 330)"/>
      <ellipse cx="970" cy="355" rx="14" ry="29" transform="rotate(-40 970 355)"/>
    </g>

    <!-- girasoles (se crean con JS) -->
    <g id="flores"></g>

    <!-- hojas extra -->
    <g class="leaf2 aparece" style="--d:2s">
      <ellipse cx="350" cy="390" rx="22" ry="42" transform="rotate(-45 350 390)"/>
      <ellipse cx="390" cy="350" rx="22" ry="42" transform="rotate(55 390 350)"/>
      <ellipse cx="650" cy="420" rx="24" ry="45" transform="rotate(-30 650 420)"/>
      <ellipse cx="700" cy="435" rx="24" ry="45" transform="rotate(45 700 435)"/>
      <ellipse cx="870" cy="455" rx="20" ry="40" transform="rotate(45 870 455)"/>
      <ellipse cx="250" cy="470" rx="20" ry="40" transform="rotate(-40 250 470)"/>
    </g>

    <!-- papel de adelante -->
    <g class="papel" style="--d:.15s">
      <path class="paper" d="M175 515 Q550 690 930 515 L850 775 Q550 820 250 775Z"/>
      <path class="paperPink" d="M240 535 Q550 690 865 535 L790 785 Q550 815 310 785Z"/>
      <path class="shine" d="M210 550 Q500 705 885 545"/>
      <path class="ribbonThin" d="M245 590 Q550 730 855 590"/>
    </g>

    <!-- mango del ramo -->
    <g class="papel" style="--d:.25s">
      <path class="paperPink" d="M390 690 L710 690 L655 820 Q550 840 445 820Z"/>
      <path class="paper" d="M425 700 L675 700 L630 820 Q550 835 470 820Z"/>
    </g>

    <!-- moño + tarjetica -->
    <g transform="translate(550 735)">
      <g class="lazo">
        <path class="bow" d="M0 0 C-95 -55 -155 -30 -115 30 C-85 75 -35 45 0 15Z"/>
        <path class="bow" d="M0 0 C95 -55 155 -30 115 30 C85 75 35 45 0 15Z"/>
        <path class="bow" d="M-5 12 L-85 115 Q-60 135 -35 105 L10 20Z"/>
        <path class="bow" d="M5 12 L85 115 Q60 135 35 105 L-10 20Z"/>
        <path d="M-60 -12 C-90 -28 -120 -15 -105 15" fill="none" stroke="#fff" stroke-width="3" opacity=".35" stroke-linecap="round"/>
        <path d="M60 -12 C90 -28 120 -15 105 15" fill="none" stroke="#fff" stroke-width="3" opacity=".35" stroke-linecap="round"/>
        <ellipse cx="0" cy="8" rx="19" ry="16" fill="#b8325a" stroke="#8e1f3f" stroke-width="1.5"/>
        <!-- tarjetica -->
        <path d="M10 14 Q90 30 150 62" fill="none" stroke="#8e1f3f" stroke-width="2"/>
        <g transform="translate(160 62) rotate(14)">
          <path d="M-8 0 L8 0 L58 0 L58 50 L-8 50 Z" fill="#fffaf2" stroke="#e5d3c0" stroke-width="2"/>
          <circle cx="4" cy="10" r="4" fill="#e5d3c0"/>
          <text x="27" y="33" text-anchor="middle" font-family="'Dancing Script',cursive" font-size="17" font-weight="700" fill="#9c2246">Pa' ti</text>
        </g>
      </g>
    </g>
  </g>
</svg>
</div>

<canvas id="particulas"></canvas>

<!-- ===================== TÍTULO ===================== -->
<header id="titulo">
  <h1 id="titulo-texto">Con mucho amor pa' ti</h1>
  <div class="corazones">🌻🤍🌻</div>
</header>

<!-- ===================== PISTA / CONTADOR ===================== -->
<div id="pista">
  <span id="pista-texto">Toca las mariposas, cada una guarda un mensaje</span>
  <b id="contador">🦋 0/12</b>
</div>

<!-- ===================== TARJETA DEL MENSAJE ===================== -->
<div id="mensaje-fondo">
  <div id="mensaje-mariposa" role="dialog" aria-modal="true" aria-live="polite">
    <div class="mensaje-icono" id="mensaje-icono">🦋</div>
    <button id="mensaje-cerrar" aria-label="Cerrar mensaje">✕</button>
    <span id="mensaje-num"></span>
    <p id="mensaje-texto"></p>
    <div class="mensaje-firma">con amor 🌻</div>
  </div>
</div>

<!-- ===================== INTRO ===================== -->
<div id="intro" role="button" aria-label="Abrir sorpresa">
  <div class="intro-flor-wrap">
    <svg class="intro-flor" viewBox="-125 -125 250 250"><use href="#flower"/></svg>
  </div>
  <div class="intro-texto">Tengo algo para ti...</div>
  <div class="intro-sub">toca para abrir</div>
</div>

<script>
  /* =========================================================
     ✏️ PERSONALIZA AQUÍ
     ========================================================= */
  // Un mensaje por mariposa: agrega o quita líneas y la cantidad cambia sola
  const MENSAJES = [
    "MI PRECIOSA 🦋🤍",
    "TE AMOOOOOOOOOOOO MUCHOOOOOOOOOOOOOOOO 😍💕",
    "AUNQUE NO TE BAÑES TE VOY A SEGUIR AMANDO 🤭🤍",
    "ERES MI TODO 🤍✨",
    "MI MUJEEEE HERMOSA 😘🌸",
    "LA MEJOOOOR 🏆💖",
    "POLVORITA 💥🤍",
    "OJOS LINDOS, BELLOS, DIVINOS 👀✨🤍",
    "ME ENCANTAAAAAAAAAAAAS 🥰💞",
    "NUNCA ME DEJES SOLITOOOOOOOOOOOOOOOOOO!! 🥺🤍",
    "21:09🤍",
    "22:11🤍",
  ];
  // Aparece cuando atrapa TODAS las mariposas
  const MENSAJE_FINAL = "ENCONTRASTE TODOS LOS MENSAJES 🦋 Y CADA UNO ES 100% VERDAD. TE AMO 🌻🤍";

  const VELOCIDAD_ESCRITURA = 40;   // ms por letra (más bajo = más rápido)

  /* =========================================================
     UTILIDADES
     ========================================================= */
  const NS = 'http://www.w3.org/2000/svg';
  const MENOS_MOV = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const aleatorio = (min, max) => Math.random() * (max - min) + min;
  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* =========================================================
     GIRASOL (pétalos dobles + semillas en espiral Fibonacci)
     ========================================================= */
  (function crearGirasol(){
    const flor = document.getElementById('flower');
    const PETALO = 'M0 -26 C 13 -46, 15 -88, 0 -116 C -15 -88, -13 -46, 0 -26Z';
    for (let i = 0; i < 20; i++)
      el('path', {d:PETALO, fill:'url(#gPetaloAtras)', transform:`rotate(${i*18})`}, flor);
    for (let i = 0; i < 20; i++)
      el('path', {d:PETALO, fill:'url(#gPetalo)', stroke:'#eea000', 'stroke-width':.8,
                  transform:`rotate(${i*18+9}) scale(.9)`}, flor);
    el('circle', {r:45, fill:'#3d1f0c'}, flor);
    el('circle', {r:41, fill:'url(#gCentro)'}, flor);
    const semillas = el('g', {}, flor);
    for (let i = 1; i < 125; i++){
      const r = 3.4 * Math.sqrt(i);
      if (r > 38) break;
      const a = i * 137.508 * Math.PI / 180;
      el('circle', {
        cx:(r*Math.cos(a)).toFixed(1), cy:(r*Math.sin(a)).toFixed(1),
        r:(1.1 + r*0.04).toFixed(2),
        fill: i % 3 ? '#1c0f07' : '#8a5424', opacity:.85
      }, semillas);
    }
    el('ellipse', {cx:-11, cy:-15, rx:17, ry:9, fill:'#fff', opacity:.09}, flor);
  })();

  /* =========================================================
     RAMO: posiciones de los girasoles
     ========================================================= */
  const FLORES = [
    {x:285, y:415, s:1.05, d:1.70},
    {x:430, y:315, s:1.25, d:1.40},
    {x:565, y:255, s:1.32, d:1.20},
    {x:705, y:320, s:1.18, d:1.50},
    {x:825, y:405, s:1.00, d:1.80},
    {x:395, y:515, s:1.05, d:2.00},
    {x:585, y:525, s:1.10, d:2.20},
    {x:735, y:490, s:0.98, d:2.10},
  ];
  const capaFlores = document.getElementById('flores');
  FLORES.forEach((f, i) => {
    const g0 = el('g', {transform:`translate(${f.x} ${f.y})`, class:'flor-clic'}, capaFlores);
    const gb = el('g', {class:'balanceo', style:`--s:${(-i*0.7).toFixed(2)}s;--b:${(3.5 + (i%3)*0.6).toFixed(1)}s`}, g0);
    const gc = el('g', {class:'crece', style:`--d:${f.d}s`}, gb);
    const gg = el('g', {class:'gira'}, gc);
    el('use', {href:'#flower', transform:`scale(${(f.s*1.06).toFixed(3)})`}, gg);

    g0.addEventListener('pointerdown', e => {
      if (!document.body.classList.contains('abierto')) return;
      gg.classList.remove('activa');
      void gg.getBoundingClientRect();     // reinicia la animación
      gg.classList.add('activa');
      explosion(e.clientX, e.clientY, 22);
    });
    gg.addEventListener('animationend', () => gg.classList.remove('activa'));
  });

  /* =========================================================
     TÍTULO letra por letra
     ========================================================= */
  (function(){
    const h1 = document.getElementById('titulo-texto');
    const letras = Array.from(h1.textContent);
    h1.textContent = '';
    letras.forEach((l, i) => {
      const s = document.createElement('span');
      s.textContent = l === ' ' ? '\u00a0' : l;
      s.style.setProperty('--i', i);
      h1.appendChild(s);
    });
  })();

  /* =========================================================
     PARTÍCULAS (luces, pétalos, corazones y explosiones)
     ========================================================= */
  const cv = document.getElementById('particulas');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  function ajustar(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  ajustar();
  addEventListener('resize', ajustar);

  const COLORES = ['#ff6a88', '#ffc21a', '#ffffff', '#c77dff', '#ff9a8b'];
  const parts = [];
  const nuevas = {
    luz: ini => ({t:'luz', x:aleatorio(0,W), y:ini?aleatorio(0,H):H+20, rad:aleatorio(2,5.5),
                  vy:aleatorio(-.45,-.15), vx:aleatorio(-.1,.1), a:aleatorio(.3,.7), f:aleatorio(0,6.28)}),
    petalo: ini => ({t:'petalo', x:aleatorio(0,W), y:ini?aleatorio(-H,H):-20, s:aleatorio(5,9),
                  vy:aleatorio(.4,1), vx:aleatorio(-.3,.3), rot:aleatorio(0,6.28), vr:aleatorio(-.02,.02),
                  flip:aleatorio(0,6.28), vf:aleatorio(.02,.05), f:aleatorio(0,6.28),
                  c:Math.random()<.5?'#ffc21a':'#ffd84d'}),
    corazon: ini => ({t:'corazon', x:aleatorio(0,W), y:ini?aleatorio(0,H):H+20, s:aleatorio(6,11),
                  vy:aleatorio(-.7,-.3), f:aleatorio(0,6.28), a:aleatorio(.35,.75),
                  c:Math.random()<.5?'#ff6a88':'#ffffff'}),
  };
  function chispa(x, y, fuerza = 1){
    const ang = aleatorio(0, Math.PI*2), v = aleatorio(2, 7) * fuerza;
    return {t:'chispa', x, y, vx:Math.cos(ang)*v, vy:Math.sin(ang)*v - 2, s:aleatorio(5,11),
            vida:1, dec:aleatorio(.008,.016), c:COLORES[Math.floor(aleatorio(0,COLORES.length))],
            forma:Math.random()<.6?'corazon':'circulo'};
  }
  function explosion(x, y, n = 30, fuerza = 1){
    if (MENOS_MOV) n = Math.ceil(n/3);
    for (let i = 0; i < n; i++) parts.push(chispa(x, y, fuerza));
  }

  (function poblar(){
    const f = Math.min(1, (W*H) / (1200*800));
    const k = MENOS_MOV ? .3 : 1;
    const cant = {luz: Math.round((14 + 26*f)*k), petalo: Math.round((6 + 10*f)*k), corazon: Math.round((4 + 6*f)*k)};
    for (const t in cant) for (let i = 0; i < cant[t]; i++) parts.push(nuevas[t](true));
  })();

  function corazonPath(s){
    ctx.beginPath();
    ctx.moveTo(0, -s*.25);
    ctx.bezierCurveTo(-s*.5, -s*.75, -s*1.1, -s*.1, 0, s*.6);
    ctx.bezierCurveTo(s*1.1, -s*.1, s*.5, -s*.75, 0, -s*.25);
    ctx.fill();
  }

  function cuadro(t){
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      ctx.save();
      if (p.t === 'luz'){
        p.x += p.vx; p.y += p.vy;
        const a = p.a * (.6 + .4*Math.sin(t/900 + p.f));
        ctx.fillStyle = '#fff3d6';
        ctx.globalAlpha = a * .18;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.rad*3.2, 0, 6.283); ctx.fill();
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.rad, 0, 6.283); ctx.fill();
        if (p.y < -30) parts[i] = nuevas.luz(false);
      }
      else if (p.t === 'petalo'){
        p.y += p.vy; p.x += p.vx + Math.sin(t/900 + p.f)*.5; p.rot += p.vr; p.flip += p.vf;
        ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.flip));
        ctx.globalAlpha = .85; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.ellipse(0, 0, p.s*.42, p.s, 0, 0, 6.283); ctx.fill();
        if (p.y > H + 30) parts[i] = nuevas.petalo(false);
      }
      else if (p.t === 'corazon'){
        p.y += p.vy;
        ctx.translate(p.x + Math.sin(t/1100 + p.f)*14, p.y);
        ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
        corazonPath(p.s);
        if (p.y < -30) parts[i] = nuevas.corazon(false);
      }
      else if (p.t === 'chispa'){
        p.vy += .12; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.vida -= p.dec;
        ctx.globalAlpha = Math.max(0, p.vida); ctx.fillStyle = p.c;
        ctx.translate(p.x, p.y);
        if (p.forma === 'corazon') corazonPath(p.s);
        else { ctx.beginPath(); ctx.arc(0, 0, p.s*.35, 0, 6.283); ctx.fill(); }
        if (p.vida <= 0 || p.y > H + 40) parts.splice(i, 1);
      }
      ctx.restore();
    }
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);

  /* =========================================================
     TARJETA DEL MENSAJE
     ========================================================= */
  const fondo   = document.getElementById('mensaje-fondo');
  const tarjeta = document.getElementById('mensaje-mariposa');
  const texto   = document.getElementById('mensaje-texto');
  const numero  = document.getElementById('mensaje-num');
  const icono   = document.getElementById('mensaje-icono');
  const cerrar  = document.getElementById('mensaje-cerrar');
  let timerEscritura, timerCierre;
  let finalPendiente = false, finalMostrado = false;

  function mostrarMensaje(mensaje, etiqueta, esFinal = false){
    clearInterval(timerEscritura);
    clearTimeout(timerCierre);
    tarjeta.classList.toggle('final', esFinal);
    icono.textContent = esFinal ? '🌻' : '🦋';
    numero.textContent = etiqueta;
    texto.textContent = '';
    texto.classList.add('escribiendo');
    fondo.classList.add('visible');

    const letras = Array.from(mensaje);   // para no partir los emojis
    let i = 0;
    timerEscritura = setInterval(() => {
      texto.textContent += letras[i++];
      if (i >= letras.length){
        clearInterval(timerEscritura);
        texto.classList.remove('escribiendo');
        timerCierre = setTimeout(cerrarMensaje, (esFinal ? 6000 : 3000) + letras.length * 60);
      }
    }, VELOCIDAD_ESCRITURA);
  }

  function cerrarMensaje(){
    clearInterval(timerEscritura);
    clearTimeout(timerCierre);
    fondo.classList.remove('visible');
    if (finalPendiente){
      finalPendiente = false;
      setTimeout(granFinal, 600);
    }
  }

  cerrar.addEventListener('click', cerrarMensaje);
  fondo.addEventListener('pointerdown', e => { if (e.target === fondo) cerrarMensaje(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarMensaje(); });

  /* =========================================================
     MARIPOSAS
     ========================================================= */
  const PALETAS = [
    ['#ff7eb6','#c77dff'], ['#ffd166','#ff8c42'], ['#7ec8ff','#b49cff'],
    ['#ff9a8b','#ff6a88'], ['#ffffff','#e0b3ff'], ['#9be7c4','#5ec2e6'],
  ];
  function svgMariposa([a, b]){
    return `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g class="ala-izq">
        <path d="M50 45 C25 5, 0 20, 8 45 C12 58, 35 58, 50 50 Z" fill="${a}" stroke="rgba(58,42,77,.35)" stroke-width="1.2"/>
        <path d="M50 52 C30 55, 12 62, 20 80 C30 95, 48 75, 50 58 Z" fill="${b}" stroke="rgba(58,42,77,.35)" stroke-width="1.2"/>
        <circle cx="22" cy="33" r="5" fill="#fff" opacity=".6"/>
        <circle cx="31" cy="42" r="2.5" fill="#fff" opacity=".5"/>
        <circle cx="29" cy="72" r="3.5" fill="#fff" opacity=".5"/>
      </g>
      <g class="ala-der">
        <path d="M50 45 C75 5, 100 20, 92 45 C88 58, 65 58, 50 50 Z" fill="${a}" stroke="rgba(58,42,77,.35)" stroke-width="1.2"/>
        <path d="M50 52 C70 55, 88 62, 80 80 C70 95, 52 75, 50 58 Z" fill="${b}" stroke="rgba(58,42,77,.35)" stroke-width="1.2"/>
        <circle cx="78" cy="33" r="5" fill="#fff" opacity=".6"/>
        <circle cx="69" cy="42" r="2.5" fill="#fff" opacity=".5"/>
        <circle cx="71" cy="72" r="3.5" fill="#fff" opacity=".5"/>
      </g>
      <ellipse cx="50" cy="54" rx="4" ry="20" fill="#3a2a4d"/>
      <circle cx="50" cy="33" r="5" fill="#3a2a4d"/>
      <path d="M48 30 Q42 16 36 12" stroke="#3a2a4d" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M52 30 Q58 16 64 12" stroke="#3a2a4d" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="36" cy="12" r="2.5" fill="#3a2a4d"/>
      <circle cx="64" cy="12" r="2.5" fill="#3a2a4d"/>
    </svg>`;
  }

  const TAMANO = innerWidth < 600 ? 72 : 96;
  const vistas = new Set();
  const contador = document.getElementById('contador');
  const pista = document.getElementById('pista');

  function actualizarContador(){
    contador.textContent = `🦋 ${vistas.size}/${MENSAJES.length}`;
    contador.classList.remove('salto');
    void contador.offsetWidth;
    contador.classList.add('salto');
  }

  function crearMariposa(mensaje, indice){
    const m = document.createElement('div');
    m.className = 'mariposa';
    m.style.width = m.style.height = TAMANO + 'px';
    m.innerHTML = `<div class="vuelo">${svgMariposa(PALETAS[indice % PALETAS.length])}</div>`;
    const svg = m.querySelector('svg');

    // entra volando desde un borde de la pantalla
    const lado = Math.floor(aleatorio(0, 4));
    let x = lado === 0 ? -TAMANO : lado === 1 ? innerWidth : aleatorio(0, innerWidth - TAMANO);
    let y = lado === 2 ? -TAMANO : lado === 3 ? innerHeight : aleatorio(0, innerHeight - TAMANO);
    m.style.left = x + 'px';
    m.style.top  = y + 'px';

    let primera = true;
    function volar(){
      const nx = aleatorio(0, innerWidth  - TAMANO);
      const ny = aleatorio(60, innerHeight - TAMANO - 60);
      const angulo = Math.atan2(ny - y, nx - x) * 180 / Math.PI + 90;
      svg.style.setProperty('--giro', angulo + 'deg');
      const dur = primera ? aleatorio(3, 5) : aleatorio(9, 16);
      primera = false;
      m.style.transitionDuration = dur + 's';
      m.style.left = nx + 'px';
      m.style.top  = ny + 'px';
      x = nx; y = ny;
      setTimeout(volar, dur * 1000);
    }

    m.addEventListener('pointerdown', e => {
      m.classList.remove('toque'); void m.offsetWidth; m.classList.add('toque');
      if (navigator.vibrate) navigator.vibrate(25);
      explosion(e.clientX, e.clientY, 14, .7);

      const nueva = !vistas.has(indice);
      vistas.add(indice);
      m.classList.add('vista');
      if (nueva) actualizarContador();
      pista.classList.add('ya');

      mostrarMensaje(mensaje, `Mensaje ${indice + 1} de ${MENSAJES.length}`);
      if (vistas.size === MENSAJES.length && !finalMostrado){
        finalMostrado = true;
        finalPendiente = true;
      }
    });

    document.body.appendChild(m);
    setTimeout(volar, 60);
  }

  /* =========================================================
     GRAN FINAL 🎉
     ========================================================= */
  function granFinal(){
    const puntos = [[.5,.45],[.25,.35],[.75,.35],[.35,.65],[.65,.65]];
    puntos.forEach(([px, py], i) =>
      setTimeout(() => explosion(W*px, H*py, 45, 1.3), i * 280));
    setTimeout(() => mostrarMensaje(MENSAJE_FINAL, '✨ Sorpresa final ✨', true), 1500);
  }

  /* =========================================================
     INTRO → ABRIR LA SORPRESA
     ========================================================= */
  const intro = document.getElementById('intro');
  for (let i = 0; i < 45; i++){
    const s = document.createElement('span');
    s.className = 'estrella';
    s.style.left = aleatorio(0, 100) + '%';
    s.style.top  = aleatorio(0, 100) + '%';
    s.style.animationDelay = aleatorio(0, 2.5) + 's';
    const t = aleatorio(1.5, 3.5);
    s.style.width = s.style.height = t + 'px';
    intro.appendChild(s);
  }

  let abierto = false;
  function abrir(){
    if (abierto) return;
    abierto = true;
    intro.classList.add('fuera');
    document.body.classList.add('abierto');
    setTimeout(() => explosion(W/2, H/2, 60, 1.4), 400);
    setTimeout(() => explosion(W/2, H*.45, 40, 1.1), 2300);
    setTimeout(() => {
      MENSAJES.forEach((msg, i) => setTimeout(() => crearMariposa(msg, i), i * 180));
      contador.textContent = `🦋 0/${MENSAJES.length}`;
    }, 3000);
    setTimeout(() => pista.classList.add('visible'), 4200);
  }
  intro.addEventListener('pointerdown', abrir);
  intro.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') abrir(); });
  intro.tabIndex = 0;
</script>
</body>
</html>
